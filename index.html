<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#020a0c;color:#ffe6a6;font-family:Georgia,"Times New Roman",serif;-webkit-tap-highlight-color:transparent}
/* fondo elegante: verde petróleo profundo, brillo dorado suave y textura de vetas */
body{background:
 radial-gradient(ellipse 60% 45% at 50% 0%,rgba(212,170,80,.16),transparent 70%),
 radial-gradient(ellipse 55% 60% at 0% 100%,rgba(16,74,78,.55),transparent 70%),
 radial-gradient(ellipse 55% 60% at 100% 100%,rgba(16,74,78,.55),transparent 70%),
 repeating-linear-gradient(115deg,rgba(255,215,130,.025) 0 2px,transparent 2px 9px),
 linear-gradient(160deg,#06191b,#020a0c 55%,#05181a)}
:root{--alto:100vh}
@supports(height:100dvh){:root{--alto:100dvh}}
.esc{position:fixed;inset:0;height:var(--alto);display:grid;place-items:center}

/* ===== recorte del diseño aprobado ===== */
.r{display:block;position:relative;background-image:url(assets/mth-diseno.jpg);background-repeat:no-repeat;
 background-size:calc(1672 / var(--w) * 100%) auto;
 background-position:calc(var(--x) / (1672 - var(--w)) * 100%) calc(var(--y) / (941 - var(--h)) * 100%);
 aspect-ratio:var(--w)/var(--h);border-radius:8px;cursor:pointer;transition:filter .2s,box-shadow .2s}
a.r:hover,a.r:focus-visible{filter:brightness(1.15);box-shadow:0 0 0 2px #ffd56b,0 0 18px rgba(255,205,90,.6);outline:none}

/* ===== modo LIENZO (web / tablet horizontal): el diseño completo, escalado ===== */
.lienzo{position:relative;width:min(100vw,calc(var(--alto) * 1672 / 941));aspect-ratio:1672/941;
 background:url(assets/mth-diseno.jpg) center/100% 100% no-repeat;border-radius:10px;
 box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 0 3px rgba(212,170,80,.55),0 20px 60px rgba(0,0,0,.8),0 0 50px rgba(212,170,80,.18)}
.lienzo .r{background-image:none!important;position:absolute;left:calc(var(--x) / 16.72 * 1%);top:calc(var(--y) / 9.41 * 1%);width:calc(var(--w) / 16.72 * 1%);height:calc(var(--h) / 9.41 * 1%);aspect-ratio:auto;background:none}
.lienzo .titulo,.lienzo .fila-titulo{display:none}
.lienzo .paises{position:absolute;left:.6%;top:52.3%;width:98.8%;height:9.6%;background:#041214;border-radius:6px}
.lienzo .audio{position:absolute;left:1.67%;top:44.6%;width:96.65%;height:5.1%}
.lienzo .bloque{display:contents}

/* ===== modo COLUMNA (celular / vertical) ===== */
.columna{width:100vw;max-width:100vw;height:var(--alto);display:flex;flex-direction:column;gap:5px;padding:calc(env(safe-area-inset-top) + 5px) 6px calc(env(safe-area-inset-bottom) + 5px)}
.columna .bloque{display:flex;gap:4px;min-height:0;width:100%;min-width:0}
.columna .r{min-width:0;min-height:0}
.columna .nav .r,.columna .fila .r{flex-basis:0}
.columna .nav{flex:none}.columna .nav .r{border-radius:20px}
.columna .nav .r{flex:1 1 0;min-width:0}
.columna .banner{flex:none}.columna .banner .r{width:100%;border:1.5px solid #c9993f}
.columna .dioses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;flex:none}
.columna .fila{flex:none}.columna .fila .r{min-width:0}
.columna .talento .r:nth-child(1){flex:278}.columna .talento .r:nth-child(2){flex:345}.columna .talento .r:nth-child(3){flex:311}
.columna .planes .r:nth-child(1){flex:160}.columna .planes .r:nth-child(2){flex:155}.columna .planes .r:nth-child(3){flex:157}.columna .planes .r:nth-child(4){flex:152}
.columna .arenas{overflow-x:auto;scrollbar-width:none;flex:none;scroll-snap-type:x mandatory}
.columna .arenas::-webkit-scrollbar{display:none}
.columna .arenas .r{flex:none;height:clamp(44px,7.5vh,62px);scroll-snap-align:start}
.columna .herr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;flex:none}
.columna .paises{flex:1 1 72px;min-height:58px;max-height:30vh}
.columna .audio{flex:none;height:44px}
.titulo{flex:none;text-align:center;font:italic 900 13px/1 "Playfair Display",Georgia,serif;letter-spacing:.06em;color:#ffd56b;text-shadow:0 1px 0 #6b430a,0 0 10px rgba(255,190,70,.4);text-transform:uppercase}
.titulo::before,.titulo::after{content:"";display:inline-block;width:34px;height:1.5px;margin:0 8px;vertical-align:middle;background:linear-gradient(90deg,transparent,#e5b04d)}
.titulo::after{transform:scaleX(-1)}
.fila-titulo{display:flex;justify-content:space-around}

/* ===== carrusel de países (vivo) ===== */
.paises{position:relative;display:flex;align-items:stretch}
.carril{flex:1;display:flex;gap:.55%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding:0 2.2%}
.carril::-webkit-scrollbar{display:none}
.pais{flex:0 0 calc((100% - 7 * .55%) / 8);scroll-snap-align:start;position:relative;border-radius:7px;overflow:hidden;border:1.5px solid #d6a648;
 box-shadow:0 0 8px rgba(255,195,80,.25);cursor:pointer;background:#000}
.columna .pais{flex-basis:30%}
.pais img{width:100%;height:100%;object-fit:cover;display:block}
.pais span{position:absolute;left:0;right:0;bottom:0;padding:10% 2px 3px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.88) 40%);
 font:italic 700 clamp(9px,1.05vw,15px)/1.1 Georgia,serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.columna .pais span{font-size:11px}
.pais.mas{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#16424a,#03100f);color:#ffd56b;font:900 clamp(10px,1.1vw,15px)/1.1 Georgia,serif;text-align:center}
.fl{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:clamp(22px,2vw,34px);aspect-ratio:1;border-radius:50%;border:1.5px solid #e2b553;
 background:radial-gradient(#3b2a07,#0a0703);color:#ffd56b;font-size:clamp(14px,1.4vw,22px);display:grid;place-items:center;cursor:pointer;padding:0}
.fl.i{left:0}.fl.d{right:0}

/* ===== reproductor de Marcela (vivo) ===== */
.audio{display:flex;align-items:center;gap:1.2%;padding:0 1.5%;border-radius:40px;border:1.5px solid #d6a648;
 background:linear-gradient(180deg,#0c2427,#030c0e);box-shadow:inset 0 0 10px rgba(255,200,90,.18),0 0 10px rgba(255,190,70,.2)}
.av{height:84%;aspect-ratio:1;border-radius:50%;flex:none;border:1.5px solid #e2b553;
 background:url(assets/mth-diseno.jpg) no-repeat;background-size:calc(1672/70*100%) auto;background-position:calc(101/(1672 - 70)*100%) calc(408/(941 - 66)*100%)}
.nom{font:italic 700 clamp(12px,1.35vw,22px) Georgia,serif;color:#fff1cf;flex:none}
.play{flex:none;height:72%;aspect-ratio:1;border-radius:50%;border:1.5px solid #e2b553;background:radial-gradient(#3b2a07,#0a0703);color:#ffd56b;font-size:clamp(11px,1vw,17px);cursor:pointer;padding:0}
.t{flex:none;font:600 clamp(10px,.9vw,14px) Georgia,serif;color:#f3e3bd;font-variant-numeric:tabular-nums}
.onda{flex:1;height:60%;min-width:40px;cursor:pointer;touch-action:none}
.vol{flex:none;background:none;border:0;color:#ffd56b;font-size:clamp(14px,1.3vw,20px);cursor:pointer}
.columna .nom{font-size:13px}
#aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 14px;border-radius:30px;background:#000;border:1px solid #d6a648;color:#ffe6a6;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#aviso.v{opacity:1}
@media(max-height:640px){.columna{gap:3px}.columna .arenas .r{height:40px}.columna .audio{height:38px}.columna .paises{min-height:50px}.titulo{font-size:11px}}
</style>
</head>

<script>
(function(){'use strict';
var L={unete:'https://t.me/ApoloAureum_Bot',apolo:'https://t.me/ApoloAureum_Bot',ares:'https://t.me/AresImperium_Bot',hades:'https://t.me/HadesNoctis_Bot',
 poseidon:'https://t.me/PoseidonOceanus_Bot',canal:'https://t.me/MegaTribuHispana',grupo:'https://t.me/DreamTeamSinFronteras',
 oceanus:'https://oceaunposeidon-bot.github.io/POSEIDON-OCEANUS-MINI-APP-OFICIAL/'};
var PAISES=[['colombia','🇨🇴','Colombia'],['peru','🇵🇪','Perú'],['paraguay','🇵🇾','Paraguay'],['panama','🇵🇦','Panamá'],['guatemala','🇬🇹','Guatemala'],
 ['eeuu','🇺🇸','Estados Unidos'],['brasil','🇧🇷','Brasil'],['argentina','🇦🇷','Argentina'],['mexico','🇲🇽','México'],['venezuela','🇻🇪','Venezuela'],
 ['espana','🇪🇸','España'],['chile','🇨🇱','Chile'],['ecuador','🇪🇨','Ecuador'],['bolivia','🇧🇴','Bolivia'],['dominicana','🇩🇴','Rep. Dominicana'],
 ['uruguay','🇺🇾','Uruguay'],['costarica','🇨🇷','Costa Rica'],['honduras','🇭🇳','Honduras'],['elsalvador','🇸🇻','El Salvador'],['cuba','🇨🇺','Cuba'],
 ['puertorico','🇵🇷','Puerto Rico'],['nicaragua','🇳🇮','Nicaragua'],['canada','🇨🇦','Canadá'],['italia','🇮🇹','Italia'],['reinounido','🇬🇧','Reino Unido'],['guinea','🇬🇶','Guinea Ecuatorial']];
var tg=window.Telegram&&window.Telegram.WebApp;
function alto(){var h=(tg&&tg.initData&&tg.viewportStableHeight)||0;if(h)document.documentElement.style.setProperty('--alto',h+'px');}
try{if(tg){tg.ready();tg.expand();tg.setHeaderColor('#041416');tg.setBackgroundColor('#020a0c');tg.onEvent('viewportChanged',function(){alto();modo();});}}catch(e){}
function abrir(u){if(!u)return;try{if(tg&&tg.initData){/^https:\/\/t\.me\//.test(u)?tg.openTelegramLink(u):tg.openLink(u);return;}}catch(e){}
 var w=window.open(u,'_blank','noopener');if(!w)location.href=u;}
document.addEventListener('click',function(e){var a=e.target.closest('[data-ir]');if(a){e.preventDefault();abrir(L[a.dataset.ir]);}});

/* recortes: tamaño y posición calculados */
[].forEach.call(document.querySelectorAll('.r'),function(el){var st=el.style,x=+st.getPropertyValue('--x'),y=+st.getPropertyValue('--y'),w=+st.getPropertyValue('--w'),h=+st.getPropertyValue('--h');
 el.style.backgroundSize=(1672/w*100)+'% '+(941/h*100)+'%';el.style.backgroundPosition=(x/(1672-w)*100)+'% '+(y/(941-h)*100)+'%';el.style.aspectRatio=w+' / '+h;});
/* modo lienzo (horizontal) o columna (vertical) */
var app=document.getElementById('app');
function modo(){var h=(tg&&tg.initData&&tg.viewportStableHeight)||innerHeight;var ancho=innerWidth>=700&&innerWidth/h>=1.25;
 app.className=ancho?'lienzo':'columna';}
alto();modo();addEventListener('resize',function(){alto();modo();});

/* países */
var c=document.getElementById('carril');
PAISES.forEach(function(p){var b=document.createElement('button');b.type='button';b.className='pais';b.setAttribute('aria-label',p[2]);
 b.innerHTML='<img alt="" loading="lazy" src="assets/'+p[0]+'.jpg"><span>'+p[1]+' '+p[2]+'</span>';b.onclick=function(){abrir(L.grupo);};c.appendChild(b);});
var m=document.createElement('button');m.type='button';m.className='pais mas';m.innerHTML='＋<br>Más países';m.onclick=function(){abrir(L.unete);};c.appendChild(m);
var pausa=0;function paso(){var p=c.querySelector('.pais');return p?p.offsetWidth+4:100;}
document.querySelector('.fl.i').onclick=function(){pausa=Date.now()+8000;c.scrollBy({left:-paso()*2});};
document.querySelector('.fl.d').onclick=function(){pausa=Date.now()+8000;c.scrollBy({left:paso()*2});};
['pointerdown','touchstart','wheel'].forEach(function(n){c.addEventListener(n,function(){pausa=Date.now()+8000;},{passive:true});});
setInterval(function(){if(Date.now()<pausa||document.hidden)return;if(c.scrollLeft+c.clientWidth>=c.scrollWidth-4)c.scrollTo({left:0});else c.scrollBy({left:paso()});},3500);

/* Marcela */
var au=document.getElementById('audio'),pl=document.getElementById('play'),cv=document.getElementById('onda'),cx=cv.getContext('2d'),ya=document.getElementById('ya'),du=document.getElementById('dur');
var picos=[];for(var i=0;i<90;i++)picos.push(.25+.75*Math.abs(Math.sin(i*1.7)*Math.cos(i*.37)));
function mm(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function dur(){return isFinite(au.duration)&&au.duration>0?au.duration:61;}
function pintar(){ya.textContent=mm(au.currentTime);du.textContent=mm(dur());var r=Math.min(2,devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;if(!w)return;
 cv.width=w*r;cv.height=h*r;cx.setTransform(r,0,0,r,0,0);var n=Math.max(30,Math.floor(w/5)),pw=w/n,av=au.currentTime/dur();
 for(var i=0;i<n;i++){var v=picos[i%picos.length],bh=Math.max(2,v*h);cx.fillStyle=(i+.5)/n<=av?'#ffd24a':'rgba(255,220,140,.32)';cx.fillRect(i*pw+pw*.25,(h-bh)/2,pw*.5,bh);}}
function buscar(e){var r=cv.getBoundingClientRect();au.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*dur();pintar();}
var arr=false;cv.addEventListener('pointerdown',function(e){arr=true;buscar(e);});addEventListener('pointermove',function(e){if(arr)buscar(e);});addEventListener('pointerup',function(){arr=false;});
['timeupdate','loadedmetadata','seeked','ended'].forEach(function(n){au.addEventListener(n,pintar);});
au.addEventListener('play',function(){pl.textContent='❚❚';});au.addEventListener('pause',function(){pl.textContent='▶';});
pl.onclick=function(){if(au.paused){var p=au.play();if(p&&p.catch)p.catch(function(){});}else au.pause();};
document.getElementById('vol').onclick=function(){au.muted=!au.muted;this.textContent=au.muted?'🔇':'🔊';};
addEventListener('resize',pintar);setTimeout(pintar,50);
})();
</script>
